name: Build Flutter APK (Test)

on:
  push:
    branches:
      - main

jobs:
  build:
    if: contains(github.event.head_commit.message, 'create apk test')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # release 모드로 빌드하되 기기별로 쪼갬
        run: flutter build apk --release --split-per-abi

      - name: Rename and Prepare APK
        run: |
          mkdir -p final_apk
          # arm64-v8a 파일만 골라서 이름을 깔끔하게 변경
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk final_apk/app-arm64-v8a-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-test
          path: final_apk/app-arm64-v8a-release.apk
          retention-days: 1  # 1일만 보관